name: 自动化测试流水线

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install flask flask-cors selenium pytest allure-pytest

    - name: 启动 Flask 后端
      run: |
        python app.py &
        sleep 3

    - name: 运行测试（跳过UI测试，仅验证框架可运行）
      run: |
        pytest tests/test_shop.py -v --alluredir=allure-results --ignore=venv || true
      continue-on-error: true

    - name: 生成 Allure 报告
      uses: simple-elf/allure-report-action@v1.7
      if: always()
      with:
        allure_results: allure-results
        allure_history: allure-history
        keep_reports: 20

    - name: 部署到 GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history