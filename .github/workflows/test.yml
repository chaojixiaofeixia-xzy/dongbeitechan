name: 自动化测试流水线

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安装项目依赖
      run: |
        python -m pip install --upgrade pip
        pip install flask flask-cors selenium pytest allure-pytest

    - name: 下载并安装 Allure 命令行工具
      run: |
        ALLURE_VERSION=2.33.0
        wget -q https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz
        tar -xzf allure-${ALLURE_VERSION}.tgz
        sudo ln -s $(pwd)/allure-${ALLURE_VERSION}/bin/allure /usr/local/bin/allure
        allure --version

    - name: 启动 Flask 后端
      run: |
        python app.py &
        sleep 3

    - name: 运行测试（跳过UI测试，环境无浏览器）
      run: |
        pytest tests/test_shop.py -v --alluredir=allure-results --ignore=venv || true
      continue-on-error: true

    - name: 生成 Allure 报告
      run: |
        allure generate allure-results -o allure-report --clean

    - name: 部署到 GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-report
        publish_branch: gh-pages
        force_orphan: true