name: 自动化测试流水线

# 当推送代码到 main 分支时触发
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install flask flask-cors selenium pytest allure-pytest

    - name: 启动 Flask 后端
      run: |
        Start-Process -NoNewWindow python app.py
        Start-Sleep -Seconds 3

    - name: 运行测试并生成 Allure 数据
      run: |
        pytest tests/test_shop.py -v --alluredir=allure-results --ignore=venv
      continue-on-error: true

    - name: 生成 Allure 报告
      uses: simple-elf/allure-report-action@v1.7
      if: always()
      with:
        allure_results: allure-results
        allure_history: allure-history
        keep_reports: 20

    - name: 部署 Allure 报告到 GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history